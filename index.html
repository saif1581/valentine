<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffd6e8, #ffeef6);
      font-family: Arial, sans-serif;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      width: 320px;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    img {
      width: 100%;
      border-radius: 15px;
      margin: 15px 0;
    }

    button {
      padding: 12px 25px;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
      position: relative;
    }

    #yes {
      background: #ff4d79;
      color: white;
      margin-right: 10px;
    }

    #no {
      background: #eee;
    }
  </style>
</head>

<body>

  <div class="card">
    <div style="font-size:32px;">🧸</div>

    <h1>Kweeny, will you be my Valentine?</h1>

    <!-- MEME IMAGE -->
    <img 
      src="https://i.imgflip.com/4/30b1gx.jpg"
      alt="valentine meme"
    >

    <!-- BUTTONS -->
    <button 
      id="yes"
      onclick="yesClicked()"
      ontouchstart="yesClicked()">
      Yes 💖
    </button>

    <button 
      id="no"
      onmouseover="moveNo()"
      ontouchstart="moveNo()">
      No 🙈
    </button>
  </div>

  <script>
    function moveNo() {
      const btn = document.getElementById("no");
      const x = Math.random() * 200 - 100;
      const y = Math.random() * 200 - 100;
      btn.style.transform = `translate(${x}px, ${y}px)`;
    }

    function yesClicked() {
      document.body.innerHTML = `
        <div style="
          display:flex;
          justify-content:center;
          align-items:center;
          height:100vh;
          text-align:center;
          font-family:Arial;
          background: linear-gradient(135deg, #ffd6e8, #ffeef6);
        ">
          <div>
            <img 
              src="https://i.imgflip.com/4/30b1gx.jpg"
              style="width:260px; border-radius:20px;"
            >
            <h1>YAYYY 💕🥰</h1>
            <p>You just made my day ❤️</p>
          </div>
        </div>
      `;
    }
  </script>

</body>
</html>
